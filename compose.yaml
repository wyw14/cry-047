services:
  api:
    build: .
    environment: {HTTP_ADDRESS: ":8080", DATABASE_URL: "postgres://cry:cry@postgres/cry?sslmode=disable"}
    ports: ["8080:8080"]
    depends_on: {postgres: {condition: service_healthy}}
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: cry, POSTGRES_PASSWORD: cry, POSTGRES_DB: cry}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U cry"], interval: 3s, timeout: 2s, retries: 10}
